openapi: 3.1.0
info:
  title: Devices Integration API
  description: |
    API сервис для управления и интеграции с внешними устройствами. 
    Поддерживает управление устройствами, получение статуса и видеопотока с камер.
  version: '1.0.0'
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Device Control
    description: Операции управления устройствами
  - name: Device Status
    description:  Получение статуса устройств
  - name: Video Stream
    description: Работа с видеопотоком RTSP

paths:
  /devices:
    get:
      tags:
        - Device Status
      summary: Получить список всех устройств
      description: Возвращает список всех доступных устройств и их статус
      operationId: listDevices
      responses:
        '200':
          description:  Успешно получен список устройств
          content:
            application/json: 
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/Error'

  /devices/{deviceId}:
    get: 
      tags:
        - Device Status
      summary: Получить информацию об устройстве
      description:  Возвращает детальную информацию об конкретном устройстве
      operationId: getDeviceInfo
      parameters:
        - name:  deviceId
          in: path
          required: true
          description:  Идентификатор устройства
          schema:
            type:  string
      responses:
        '200':
          description: Успешно получена информация об устройстве
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '404':
          description: Устройство не найдено
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /devices/{deviceId}/status: 
    get:
      tags: 
        - Device Status
      summary: Получить статус устройства
      description: Возвращает текущий статус устройства
      operationId: getDeviceStatus
      parameters:
        - name: deviceId
          in:  path
          required: true
          description: Идентификатор устройства
          schema: 
            type: string
      responses: 
        '200':
          description: Успешно получен статус устройства
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
        '404':
          description: Устройство не найдено
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'
        '500':
          description: Внутренняя ошибка сервера
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /devices/{deviceId}/commands:
    post:
      tags:
        - Device Control
      summary: Отправить команду устройству
      description: Отправляет команду управления внешнему устройству
      operationId: sendCommand
      parameters: 
        - name: deviceId
          in: path
          required: true
          description: Идентификатор устройства
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses: 
        '200':
          description:  Команда успешно отправлена
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/CommandResponse'
        '400':
          description: Неверный формат команды
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description:  Устройство не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': 
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'

  /devices/{deviceId}/commands/{commandId}:
    get:
      tags:
        - Device Control
      summary: Получить статус команды
      description:  Возвращает статус выполнения отправленной команды
      operationId: getCommandStatus
      parameters:
        - name: deviceId
          in: path
          required: true
          description: Идентификатор устройства
          schema:
            type: string
        - name: commandId
          in: path
          required:  true
          description: Идентификатор команды
          schema:
            type: string
      responses:
        '200': 
          description: Статус команды успешно получен
          content:
            application/json: 
              schema:
                $ref:  '#/components/schemas/CommandStatus'
        '404':
          description: Команда или устройство не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': 
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /devices/{deviceId}/stream/rtsp:
    get:
      tags:
        - Video Stream
      summary: Получить URL видеопотока RTSP
      description: Возвращает URL для подключения к видеопотоку с камеры устройства
      operationId:  getRtspStreamUrl
      parameters:
        - name: deviceId
          in:  path
          required: true
          description: Идентификатор устройства с камерой
          schema:
            type: string
        - name: quality
          in: query
          required: false
          description: Качество видеопотока
          schema:
            type: string
            enum: 
              - low
              - medium
              - high
            default: medium
      responses: 
        '200':
          description:  URL видеопотока успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RtspStream'
        '404':
          description: Устройство или камера не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': 
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Error'

  /devices/{deviceId}/stream/rtsp/stop:
    post:
      tags:
        - Video Stream
      summary: Остановить видеопоток
      description: Останавливает видеопоток с камеры устройства
      operationId: stopRtspStream
      parameters:
        - name: deviceId
          in:  path
          required: true
          description: Идентификатор устройства
          schema:
            type: string
      responses:
        '200': 
          description: Видеопоток успешно остановлен
          content:
            application/json: 
              schema:
                $ref: '#/components/schemas/OperationResult'
        '404':
          description: Устройство не найдено
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description:  Внутренняя ошибка сервера
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Device:
      type: object
      required:
        - id
        - name
        - type
        - status
      properties:
        id:
          type: string
          description: Уникальный идентификатор устройства
          example: "device-001"
        name:
          type: string
          description: Название устройства
          example: "Камера входа"
        type:
          type: string
          description:  Тип устройства
          enum:
            - camera
            - motion_sensor
            - door_lock
            - light
            - temperature_sensor
            - other
          example: "camera"
        status:
          type: string
          description: Текущий статус устройства
          enum:
            - online
            - offline
            - error
          example: "online"

    DeviceDetail:
      allOf:
        - $ref:  '#/components/schemas/Device'
        - type: object
          properties: 
            model:
              type: string
              description: Модель устройства
              example:  "RTSP-Camera-Pro"
            manufacturer:
              type: string
              description: Производитель
              example: "TechVision"
            firmware_version:
              type: string
              description: Версия прошивки
              example: "2.1.0"
            ip_address:
              type: string
              description: IP адрес устройства
              example: "192.168.1.100"
            mac_address:
              type: string
              description: MAC адрес устройства
              example: "00:1A:2B:3C:4D:5E"
            connected_since:
              type: string
              format: date-time
              description:  Время подключения устройства
              example: "2025-01-15T10:30:00Z"
            capabilities:
              type: array
              description: Список возможностей устройства
              items: 
                type: string
              example:
                - "video_streaming"
                - "remote_control"
                - "motion_detection"

    DeviceStatus:
      type: object
      required:
        - deviceId
        - status
        - timestamp
      properties:
        deviceId:
          type: string
          description: Идентификатор устройства
          example: "device-001"
        status:
          type:  string
          description: Статус устройства
          enum: 
            - online
            - offline
            - error
          example:  "online"
        timestamp: 
          type: string
          format: date-time
          description:  Время получения статуса
          example:  "2025-01-15T10:35:00Z"
        signal_strength:
          type: integer
          description: Уровень сигнала (0-100)
          minimum: 0
          maximum: 100
          example: 85
        uptime_seconds:
          type: integer
          description: Время работы в секундах
          example: 86400
        last_heartbeat:
          type: string
          format: date-time
          description: Время последнего сигнала "жизни"
          example: "2025-01-15T10:35:15Z"

    Command:
      type: object
      required: 
        - command_type
        - parameters
      properties:
        command_type:
          type: string
          description: Тип команды
          enum:
            - power_on
            - power_off
            - restart
            - configure
            - capture_snapshot
            - start_recording
            - stop_recording
            - unlock
            - lock
            - set_brightness
            - set_color
          example: "power_on"
        parameters:
          type: object
          description: Параметры команды
          additionalProperties:  true
          example:
            duration_seconds: 30

    CommandResponse:
      type: object
      required:
        - commandId
        - deviceId
        - status
        - timestamp
      properties:
        commandId:
          type: string
          description: Идентификатор команды
          example: "cmd-12345"
        deviceId: 
          type: string
          description:  Идентификатор устройства
          example: "device-001"
        status:
          type: string
          description:  Статус выполнения команды
          enum:
            - accepted
            - processing
            - completed
            - failed
          example: "accepted"
        timestamp:
          type: string
          format: date-time
          description: Время отправки команды
          example:  "2025-01-15T10:35:00Z"
        message:
          type: string
          description: Сообщение о статусе
          example: "Команда принята и обрабатывается"

    CommandStatus:
      type: object
      required:
        - commandId
        - deviceId
        - status
      properties:
        commandId: 
          type: string
          description:  Идентификатор команды
          example: "cmd-12345"
        deviceId: 
          type: string
          description:  Идентификатор устройства
          example: "device-001"
        status:
          type: string
          description:  Текущий статус команды
          enum:
            - accepted
            - processing
            - completed
            - failed
          example: "completed"
        progress:
          type: integer
          description: Прогресс выполнения (0-100)
          minimum: 0
          maximum: 100
          example: 100
        result:
          type: object
          description: Результат выполнения команды
          additionalProperties: true
        error_message:
          type: string
          description: Сообщение об ошибке (если есть)
          example: null
        completed_at:
          type: string
          format: date-time
          description: Время завершения команды
          example: "2025-01-15T10:35:30Z"

    RtspStream:
      type: object
      required:
        - streamUrl
        - deviceId
        - status
      properties:
        streamUrl:
          type: string
          description: URL для подключения к RTSP потоку
          example: "rtsp://192.168.1.100:554/stream1"
        deviceId:
          type: string
          description:  Идентификатор устройства
          example: "device-001"
        status:
          type: string
          description: Статус потока
          enum: 
            - active
            - inactive
            - error
          example: "active"
        quality:
          type: string
          description: Качество видео
          example: "1080p"
        frame_rate: 
          type: integer
          description: Частота кадров (fps)
          example: 30
        codec:
          type: string
          description: Видеокодек
          example: "h264"
        expires_at:
          type: string
          format: date-time
          description: Время истечения ссылки на поток
          example: "2025-01-15T12:35:00Z"

    OperationResult:
      type: object
      required:
        - success
        - message
      properties:
        success: 
          type: boolean
          description: Успешно ли выполнена операция
          example: true
        message:
          type: string
          description: Сообщение о результате
          example: "Видеопоток успешно остановлен"
        timestamp:
          type: string
          format: date-time
          description: Время выполнения операции
          example: "2025-01-15T10:35:00Z"

    Error:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code: 
          type: string
          description: Код ошибки
          example: "DEVICE_NOT_FOUND"
        message:
          type: string
          description: Описание ошибки
          example: "Устройство с указанным ID не найдено"
        timestamp:
          type: string
          format: date-time
          description: Время возникновения ошибки
          example: "2025-01-15T10:35:00Z"
        details:
          type: object
          description: Дополнительные детали ошибки
          additionalProperties: true